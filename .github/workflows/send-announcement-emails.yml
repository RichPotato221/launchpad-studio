name: Send announcement emails

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-announcement-emails
        run: |
          curl -X POST "https://abcxyz.supabase.co/functions/v1/send-announcement-emails" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
